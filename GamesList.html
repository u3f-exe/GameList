<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لیست بازی‌ها</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3248;--accent:#6c63ff;--accent-soft:rgba(108,99,255,0.12);--accent-border:rgba(108,99,255,0.35);--text:#e8e9f0;--text2:#8b8fa8;--text3:#555870;--success:#22c55e;--success-soft:rgba(34,197,94,0.1);--danger:#ef4444;--danger-soft:rgba(239,68,68,0.1);--radius:8px;--radius-lg:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;}
.topbar-brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;}
.topbar-brand svg{color:var(--accent);}
.cart-btn{position:relative;width:40px;height:40px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
.cart-count{position:absolute;top:-6px;left:-6px;width:19px;height:19px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:none;align-items:center;justify-content:center;}
.cart-count.show{display:flex;}
.search-bar{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
.search-inner{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;}
.search-inner input{border:none;background:transparent;color:var(--text);font-size:14px;outline:none;width:100%;font-family:inherit;}
.search-inner svg{color:var(--text3);flex-shrink:0;}
.filter-row{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.filter-label{font-size:12px;color:var(--text2);white-space:nowrap;}
.filter-select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;}
.filter-value-sel{padding:6px 10px;border:1px solid var(--accent-border);border-radius:var(--radius);background:var(--accent-soft);color:var(--accent);font-size:13px;font-family:inherit;}
.reset-btn{padding:6px 12px;border-radius:var(--radius);border:1px solid var(--danger);background:transparent;color:var(--danger);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.genre-tabs{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:6px;overflow-x:auto;background:var(--bg);}
.genre-tabs::-webkit-scrollbar{height:0;}
.gtab{padding:5px 14px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text2);transition:all 0.15s;}
.gtab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.gtab:hover:not(.active){border-color:var(--text3);color:var(--text);}
.game-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px;padding-bottom:90px;}
.game-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:border-color 0.15s;}
.game-card:hover{border-color:var(--accent-border);}
.game-card.expanded{border-color:var(--accent);}
.card-main{padding:12px 14px;display:flex;align-items:center;gap:10px;}
.card-info{flex:1;min-width:0;}
.game-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meta-row{display:flex;flex-wrap:wrap;gap:4px;}
.chip{font-size:11px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 8px;white-space:nowrap;}
.add-btn{width:36px;height:36px;border-radius:var(--radius);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:20px;font-weight:300;transition:all 0.15s;}
.add-btn.add{background:rgba(34,197,94,0.15);color:var(--success);}
.add-btn.add:hover{background:var(--success);color:#fff;}
.add-btn.remove{background:var(--danger-soft);color:var(--danger);}
.add-btn.remove:hover{background:var(--danger);color:#fff;}
.card-detail{padding:0 14px 12px;border-top:1px solid var(--border);display:none;}
.card-detail.open{display:block;padding-top:12px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-bottom:8px;}
.detail-row{font-size:12px;display:flex;flex-direction:column;gap:2px;}
.detail-row .dlabel{color:var(--text3);}
.detail-row .dval{color:var(--text2);}
.detail-full{font-size:12px;margin-top:6px;color:var(--text2);line-height:1.5;}
.detail-full .dlabel{color:var(--text3);margin-bottom:2px;}
.no-info{font-size:12px;color:var(--text3);font-style:italic;}
.section-head{font-size:11px;font-weight:600;color:var(--text3);padding:8px 0 6px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:0.5px;}
.section-head::after{content:'';flex:1;height:1px;background:var(--border);}
.empty{text-align:center;padding:50px 16px;color:var(--text3);}
.float-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;display:none;align-items:center;gap:10px;z-index:90;}
.float-bar.show{display:flex;}
.float-label{font-size:13px;color:var(--text);flex:1;}
.float-count{background:var(--accent);color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600;}
.copy-btn{padding:8px 16px;border-radius:var(--radius);background:var(--success-soft);color:var(--success);border:1px solid var(--success);font-size:13px;cursor:pointer;font-family:inherit;}
.copy-btn:hover{background:var(--success);color:#fff;}

/* CART PAGE */
.cart-page{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;}
.cart-page.show{display:block;}
.cart-topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;}
.back-btn{padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;}
.cart-title{font-size:15px;font-weight:600;}
.cart-body{padding:16px;}
.cart-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.cart-item-name{font-size:14px;font-weight:500;}
.cart-item-meta{font-size:12px;color:var(--text2);margin-top:3px;}
.remove-cart{width:28px;height:28px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-size:16px;}
.cart-actions{padding:16px;border-top:1px solid var(--border);display:flex;gap:8px;}
.cart-actions button{flex:1;padding:10px;border-radius:var(--radius);font-size:14px;cursor:pointer;font-family:inherit;}
.copied-msg{text-align:center;font-size:12px;color:var(--success);margin-top:8px;display:none;}
select option{background:var(--surface2);}
</style>
</head>

<div class="topbar">

    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01M8 12h.01M16 12h.01"/></svg>

<div class="search-bar">

</div>

<div class="filter-row">

  <button class="reset-btn" onclick="resetAll()">↺ پاک کردن</button>
</div>

<div class="genre-tabs" id="genre-tabs"></div>
<div class="game-list" id="game-list"></div>

<div class="float-bar" id="float-bar">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.99 1.61h9.72a2 2 0 001.99-1.61L23 6H6"/></svg>
  <span class="float-label">لیست انتخابی</span>
  <span class="float-count" id="float-count">0</span>
  <button class="copy-btn" onclick="openCart()">مشاهده و کپی</button>
</div>

<!-- CART PAGE -->
<div class="cart-page" id="cart-page">
  <div class="cart-topbar">
    <button class="back-btn" onclick="closeCart()">← برگشت</button>
    <span class="cart-title">لیست انتخابی من</span>
  </div>
  <div class="cart-body" id="cart-body"></div>
  <div class="cart-actions">
    <button onclick="copyCart()" style="background:var(--success-soft);color:var(--success);border:1px solid var(--success);">کپی لیست</button>
    <button onclick="clearCart()" style="background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);">پاک کردن</button>
  </div>
  <div class="copied-msg" id="copied-msg">✓ لیست کپی شد!</div>
</div>

let cart = JSON.parse(localStorage.getItem('gm_cart')||'[]');
let activeGenre = '';
let expandedId = '';

function saveCart(){localStorage.setItem('gm_cart',JSON.stringify(cart));}

// genres
const genres = [...new Set(GAMES.map(g=>g.genre).filter(Boolean))];

function initGenreTabs(){
  const el=document.getElementById('genre-tabs');
  el.innerHTML=genres.map((g,i)=>`<div class="gtab${i===0?' active':''}" onclick="pickGenre('${g}')">${g}</div>`).join('');
  if(genres.length>0) activeGenre=genres[0];
}

function pickGenre(g){
  activeGenre=g;
  document.querySelectorAll('.gtab').forEach(t=>t.classList.toggle('active',t.textContent===g));
  applyFilters();
}

function updateFilterValues(){
  const type=document.getElementById('filter-type').value;
  const sel=document.getElementById('filter-value');
  if(!type){sel.style.display='none';applyFilters();return;}
  const vals=[...new Set(GAMES.map(g=>g[type]).filter(Boolean))].sort();
  sel.innerHTML=`<option value="">— همه —</option>`+vals.map(v=>`<option>${v}</option>`).join('');
  sel.style.display='';
  applyFilters();
}

function applyFilters(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const type=document.getElementById('filter-type').value;
  const val=(document.getElementById('filter-value').value||'');

  let games=GAMES;
  if(activeGenre && !type) games=games.filter(g=>g.genre===activeGenre);
  if(type&&val) games=games.filter(g=>(g[type]||'')===(val));
  if(q) games=games.filter(g=>g.name.toLowerCase().includes(q)||(g.developer||'').toLowerCase().includes(q));

  renderList(games);
}

function renderList(games){
  const el=document.getElementById('game-list');
  if(games.length===0){el.innerHTML='<div class="empty">بازی‌ای یافت نشد</div>';return;}

  // group by genre if no filter
  const type=document.getElementById('filter-type').value;
  const q=document.getElementById('search').value;
  const grouped = (!type && !q) ? groupBy(games,'genre') : {'نتایج جستجو': games};

  el.innerHTML=Object.entries(grouped).map(([genre,list])=>`
    <div class="section-head">${genre} — ${list.length} بازی</div>
    ${list.map(g=>gameCard(g)).join('')}
  `).join('');
}

function groupBy(arr,key){
  return arr.reduce((acc,g)=>{
    const k=g[key]||'سایر';
    if(!acc[k])acc[k]=[];
    acc[k].push(g);
    return acc;
  },{});
}

function gameCard(g){
  const inCart=cart.includes(g.id);
  const expanded=expandedId===g.id;
  return `<div class="game-card${expanded?' expanded':''}" id="card-${g.id}">
    <div class="card-main" onclick="toggleExpand('${g.id}')">
      <div class="card-info">
        <div class="game-name">${g.name}</div>
        <div class="meta-row">
          ${g.year?`<span class="chip">${g.year}</span>`:''}
          ${g.version?`<span class="chip">${g.version}</span>`:''}
          ${g.developer?`<span class="chip">${g.developer}</span>`:''}
          ${g.size?`<span class="chip">${g.size}</span>`:''}
          ${g.installTime?`<span class="chip">${g.installTime}</span>`:''}
        </div>
      </div>
      <button class="add-btn ${inCart?'remove':'add'}" onclick="event.stopPropagation();toggleCart('${g.id}')">
        ${inCart?'−':'+'}
      </button>
    </div>
    <div class="card-detail${expanded?' open':''}">
      ${buildDetail(g)}
    </div>
  </div>`;
}

function buildDetail(g){
  const rows=[];
  if(g.developer) rows.push({l:'سازنده',v:g.developer});
  if(g.year) rows.push({l:'سال انتشار',v:g.year});
  if(g.version) rows.push({l:'نسخه',v:g.version});
  if(g.size) rows.push({l:'حجم',v:g.size});
  if(g.installTime) rows.push({l:'زمان نصب',v:g.installTime});
  if(rows.length===0&&!g.requirements&&!g.notes) return `<p class="no-info">اطلاعات تکمیلی ثبت نشده</p>`;
  return `
    ${rows.length>0?`<div class="detail-grid">${rows.map(r=>`<div class="detail-row"><span class="dlabel">${r.l}</span><span class="dval">${r.v}</span></div>`).join('')}</div>`:''}
    ${g.requirements?`<div class="detail-full"><div class="dlabel">حداقل سیستم:</div>${g.requirements}</div>`:''}
    ${g.notes?`<div class="detail-full" style="margin-top:6px"><div class="dlabel">توضیحات:</div>${g.notes}</div>`:''}
  `;
}

function toggleExpand(id){
  expandedId = expandedId===id?'':id;
  applyFilters();
}

function toggleCart(id){
  if(cart.includes(id)) cart=cart.filter(x=>x!==id);
  else cart.push(id);
  saveCart();
  updateCartUI();
  applyFilters();
}

function updateCartUI(){
  const n=cart.length;
  const cc=document.getElementById('cart-count');
  cc.textContent=n;
  cc.classList.toggle('show',n>0);
  document.getElementById('float-count').textContent=n;
  document.getElementById('float-bar').classList.toggle('show',n>0);
  document.getElementById('float-count').textContent=n+' بازی';
}

function openCart(){
  renderCartPage();
  document.getElementById('cart-page').classList.add('show');
}

function closeCart(){
  document.getElementById('cart-page').classList.remove('show');
}

function renderCartPage(){
  const items=GAMES.filter(g=>cart.includes(g.id));
  const el=document.getElementById('cart-body');
  if(items.length===0){el.innerHTML='<div class="empty">هیچ بازی انتخاب نشده</div>';return;}
  el.innerHTML=items.map(g=>`
    <div class="cart-item">
      <div>
        <div class="cart-item-name">${g.name}</div>
        <div class="cart-item-meta">${[g.genre,g.year,g.size].filter(Boolean).join(' · ')}</div>
      </div>
      <button class="remove-cart" onclick="toggleCart('${g.id}');renderCartPage()">✕</button>
    </div>
  `).join('');
}

function copyCart(){
  const items=GAMES.filter(g=>cart.includes(g.id));
  const text=items.map((g,i)=>`${i+1}. ${g.name}${g.year?' ('+g.year+')':''}${g.developer?' — '+g.developer:''}${g.size?' | '+g.size:''}`).join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    const msg=document.getElementById('copied-msg');
    msg.style.display='block';
    setTimeout(()=>msg.style.display='none',2500);
  });
}

function clearCart(){
  cart=[];
  saveCart();
  updateCartUI();
  renderCartPage();
  applyFilters();
}

function resetAll(){
  cart=[];saveCart();
  document.getElementById('search').value='';
  document.getElementById('filter-type').value='';
  document.getElementById('filter-value').style.display='none';
  expandedId='';
  if(genres.length>0){activeGenre=genres[0];document.querySelectorAll('.gtab').forEach((t,i)=>t.classList.toggle('active',i===0));}
  updateCartUI();
  applyFilters();
}

initGenreTabs();
applyFilters();
updateCartUI();
</script>
</body>
</html>
