<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لیست بازی‌ها</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6c63ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GameList">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3248;--accent:#6c63ff;--accent-soft:rgba(108,99,255,0.12);--accent-border:rgba(108,99,255,0.35);--text:#e8e9f0;--text2:#8b8fa8;--text3:#555870;--success:#22c55e;--success-soft:rgba(34,197,94,0.1);--danger:#ef4444;--danger-soft:rgba(239,68,68,0.1);--radius:8px;--radius-lg:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:14px;padding-bottom:80px;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;}
.brand svg{color:var(--accent);}
.cart-btn{position:relative;width:40px;height:40px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
.cart-count{position:absolute;top:-6px;left:-6px;width:19px;height:19px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:none;align-items:center;justify-content:center;}
.cart-count.show{display:flex;}
.filter-bar{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.search-inner{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;flex:1;min-width:180px;}
.search-inner input{border:none;background:transparent;color:var(--text);font-size:14px;outline:none;width:100%;font-family:inherit;}
.filter-sel{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;}
.filter-val{padding:7px 10px;border:1px solid var(--accent-border);border-radius:var(--radius);background:var(--accent-soft);color:var(--accent);font-size:13px;font-family:inherit;}
.reset-btn{padding:7px 12px;border-radius:var(--radius);border:1px solid var(--danger);background:transparent;color:var(--danger);font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.game-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
.section-head{font-size:11px;font-weight:600;color:var(--text3);padding:8px 0 6px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:0.5px;}
.section-head::after{content:'';flex:1;height:1px;background:var(--border);}
.game-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:border-color 0.15s;}
.game-card:hover{border-color:var(--accent-border);}
.game-card.expanded{border-color:var(--accent);}
.card-main{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.card-info{flex:1;min-width:0;}
.game-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:5px;}
.meta-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.chip{font-size:11px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 8px;white-space:nowrap;}
.chip.farsi{background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.3);color:var(--success);}
.add-btn{width:36px;height:36px;border-radius:var(--radius);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:22px;font-weight:300;transition:all 0.15s;line-height:1;}
.add-btn.add{background:rgba(34,197,94,0.15);color:var(--success);}
.add-btn.add:hover{background:var(--success);color:#fff;}
.add-btn.remove{background:var(--danger-soft);color:var(--danger);}
.add-btn.remove:hover{background:var(--danger);color:#fff;}
.card-detail{padding:12px 14px;border-top:1px solid var(--border);display:none;}
.card-detail.open{display:block;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-bottom:8px;}
.detail-row{font-size:12px;display:flex;flex-direction:column;gap:2px;}
.dlabel{color:var(--text3);font-size:11px;}
.dval{color:var(--text2);}
.detail-full{font-size:12px;margin-top:8px;color:var(--text2);line-height:1.6;}
.detail-full .dlabel{margin-bottom:3px;display:block;}
.version-list{margin-top:6px;display:flex;flex-direction:column;gap:5px;}
.version-row{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.ver-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:11px;color:var(--text2);}
.empty{text-align:center;padding:50px 16px;color:var(--text3);}
.float-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;display:none;align-items:center;gap:10px;z-index:90;}
.float-bar.show{display:flex;}
.float-label{font-size:13px;color:var(--text);flex:1;}
.float-count{background:var(--accent);color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600;}
.view-cart-btn{padding:8px 16px;border-radius:var(--radius);background:var(--success-soft);color:var(--success);border:1px solid var(--success);font-size:13px;cursor:pointer;font-family:inherit;}
.cart-page{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;}
.cart-page.show{display:block;}
.cart-topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;}
.back-btn{padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;}
.cart-body{padding:16px;}
.cart-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.cart-item-name{font-size:14px;font-weight:500;}
.cart-item-meta{font-size:12px;color:var(--text2);margin-top:3px;}
.rm-btn{width:28px;height:28px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-size:16px;}
.cart-actions{padding:16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;}
.cart-actions button{flex:1;min-width:120px;padding:10px;border-radius:var(--radius);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;}
.notify{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--success);border-radius:var(--radius);padding:10px 18px;font-size:13px;color:var(--success);z-index:999;display:none;}
select option{background:var(--surface2);}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01M8 12h.01M16 12h.01"/></svg>
    لیست بازی‌ها
  </div>
  <div class="cart-btn" onclick="openCart()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.99 1.61h9.72a2 2 0 001.99-1.61L23 6H6"/></svg>
    <span class="cart-count" id="cart-count">0</span>
  </div>
</div>

<div class="filter-bar">
  <div class="search-inner">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="جستجو در همه بازی‌ها..." oninput="applyFilters()">
  </div>
  <select class="filter-sel" id="filter-type" onchange="updateFilterValues()">
    <option value="genre">ژانر</option>
    <option value="year">سال انتشار</option>
    <option value="developer">سازنده</option>
  </select>
  <select class="filter-val" id="filter-value" onchange="applyFilters()"></select>
  <button class="reset-btn" onclick="resetAll()">↺ پاک</button>
</div>

<div class="game-list" id="game-list"></div>

<div class="float-bar" id="float-bar">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.99 1.61h9.72a2 2 0 001.99-1.61L23 6H6"/></svg>
  <span class="float-label">لیست انتخابی</span>
  <span class="float-count" id="float-count">0 بازی</span>
  <button class="view-cart-btn" onclick="openCart()">مشاهده و کپی</button>
</div>

<div class="cart-page" id="cart-page">
  <div class="cart-topbar">
    <button class="back-btn" onclick="closeCart()">← برگشت</button>
    <span style="font-size:15px;font-weight:600;">لیست انتخابی</span>
  </div>
  <div class="cart-body" id="cart-body"></div>
  <div class="cart-actions">
    <button onclick="copySimple()" style="background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);">کپی فقط نام بازی</button>
    <button onclick="copyDetailed()" style="background:var(--success-soft);color:var(--success);border:1px solid var(--success);">کپی با جزئیات کامل</button>
    <button onclick="clearCart()" style="background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);">پاک کردن</button>
  </div>
</div>

<div class="notify" id="notify"></div>

let cart=JSON.parse(localStorage.getItem('gm_cart')||'[]');
let expandedId='';

function saveCart(){localStorage.setItem('gm_cart',JSON.stringify(cart));}

const genres=[...new Set(GAMES.map(g=>g.genre).filter(Boolean))];

function updateFilterValues(){
  const type=document.getElementById('filter-type').value;
  const sel=document.getElementById('filter-value');
  const vals=[...new Set(GAMES.map(g=>g[type]).filter(Boolean))].sort();
  sel.innerHTML='<option value="">— همه —</option>'+vals.map(v=>`<option>${v}</option>`).join('');
  applyFilters();
}

function applyFilters(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const type=document.getElementById('filter-type').value;
  const val=document.getElementById('filter-value').value||'';
  let games=GAMES;
  if(type&&val) games=games.filter(g=>(g[type]||'')===val);
  if(q) games=games.filter(g=>
    g.name.toLowerCase().includes(q)||
    (g.developer||'').toLowerCase().includes(q)||
    (g.genre||'').toLowerCase().includes(q)||
    (g.year||'').includes(q)
  );
  renderList(games,!val&&!q);
}

function groupBy(arr,key){
  return arr.reduce((a,g)=>{const k=g[key]||'سایر';if(!a[k])a[k]=[];a[k].push(g);return a;},{});
}

function renderList(games,doGroup){
  const el=document.getElementById('game-list');
  if(!games.length){el.innerHTML='<div class="empty">بازی‌ای یافت نشد</div>';return;}
  const grouped=doGroup?groupBy(games,'genre'):{'نتایج جستجو':games};
  el.innerHTML=Object.entries(grouped).map(([genre,list])=>
    `<div class="section-head">${genre} — ${list.length} بازی</div>`+
    list.map(g=>gameCard(g)).join('')
  ).join('');
}

function locIcon(loc){
  if(!loc)return'';
  const map={'HDD 1TB':'💾<b style="font-size:10px">1</b>','HDD 2TB':'💾<b style="font-size:10px">2</b>','HDD Home':'💾🏠'};
  return loc.split('|').map(l=>{const k=l.trim();return`<span style="color:#f97316;font-size:13px" title="${k}">${map[k]||k}</span>`;}).join(' ');
}

function gameCard(g){
  const inCart=cart.includes(g.id);
  const expanded=expandedId===g.id;
  const farsiChips=(g.farsiSub?'<span class="chip farsi">زیرنویس فارسی</span>':'')+(g.farsiDub?'<span class="chip farsi">دوبله فارسی</span>':'');
  const loc=g.location?locIcon(g.location):'';
  return`<div class="game-card${expanded?' expanded':''}" id="card-${g.id}">
    <div class="card-main" onclick="toggleExpand('${g.id}')">
      <div class="card-info">
        <div class="game-name">${g.name} ${loc}</div>
        <div class="meta-row">
          ${g.year?`<span class="chip">${g.year}</span>`:''}
          ${g.developer?`<span class="chip">${g.developer}</span>`:''}
          ${g.size?`<span class="chip">${g.size}</span>`:''}
          ${g.installTime?`<span class="chip">⏱ ${g.installTime}</span>`:''}
          ${farsiChips}
        </div>
      </div>
      <button class="add-btn ${inCart?'remove':'add'}" onclick="event.stopPropagation();toggleCart('${g.id}')">
        ${inCart?'−':'+'}
      </button>
    </div>
    <div class="card-detail${expanded?' open':''}">
      ${buildDetail(g)}
    </div>
  </div>`;
}

function buildDetail(g){
  const rows=[];
  if(g.developer)rows.push({l:'سازنده',v:g.developer});
  if(g.year)rows.push({l:'سال انتشار',v:g.year});
  if(g.size)rows.push({l:'حجم',v:g.size});
  if(g.installTime)rows.push({l:'زمان نصب',v:g.installTime});
  if(g.version)rows.push({l:'نسخه / پچ',v:g.version});
  let html='';
  if(rows.length)html+=`<div class="detail-grid">${rows.map(r=>`<div class="detail-row"><span class="dlabel">${r.l}</span><span class="dval">${r.v}</span></div>`).join('')}</div>`;
  if(g.requirements)html+=`<div class="detail-full"><span class="dlabel">حداقل سیستم مورد نیاز:</span>${g.requirements}</div>`;
  if(g.requirementsRec)html+=`<div class="detail-full"><span class="dlabel">سیستم پیشنهادی:</span>${g.requirementsRec}</div>`;
  if(g.notes)html+=`<div class="detail-full"><span class="dlabel">توضیحات:</span>${g.notes}</div>`;
  if(g.versions&&g.versions.length){
    html+=`<div class="detail-full"><span class="dlabel">نسخه‌های موجود:</span>
    <div class="version-list">${g.versions.map(v=>`<div class="version-row">
      ${v.name||v.repack?`<span class="ver-chip">${v.name||v.repack}</span>`:''}
      ${v.size?`<span class="ver-chip">💾 ${v.size}</span>`:''}
      ${v.installTime?`<span class="ver-chip">⏱ ${v.installTime}</span>`:''}
      ${v.location?`<span style="color:#f97316;font-size:11px">${v.location}</span>`:''}
      ${v.notes?`<span style="font-size:11px;color:var(--text3)">${v.notes}</span>`:''}
    </div>`).join('')}</div></div>`;
  }
  if(!html)return'<p style="font-size:12px;color:var(--text3)">اطلاعات تکمیلی ثبت نشده</p>';
  return html;
}

function toggleExpand(id){expandedId=expandedId===id?'':id;applyFilters();}

function toggleCart(id){
  if(cart.includes(id))cart=cart.filter(x=>x!==id);
  else cart.push(id);
  saveCart();updateCartUI();applyFilters();
}

function updateCartUI(){
  const n=cart.length;
  const cc=document.getElementById('cart-count');
  cc.textContent=n;cc.classList.toggle('show',n>0);
  document.getElementById('float-count').textContent=n+' بازی';
  document.getElementById('float-bar').classList.toggle('show',n>0);
}

function openCart(){renderCartPage();document.getElementById('cart-page').classList.add('show');}
function closeCart(){document.getElementById('cart-page').classList.remove('show');}

function renderCartPage(){
  const items=GAMES.filter(g=>cart.includes(g.id));
  const el=document.getElementById('cart-body');
  if(!items.length){el.innerHTML='<div class="empty">هیچ بازی انتخاب نشده</div>';return;}
  el.innerHTML=items.map(g=>`
    <div class="cart-item">
      <div>
        <div class="cart-item-name">${g.name}</div>
        <div class="cart-item-meta">${[g.genre,g.year,g.size].filter(Boolean).join(' · ')}</div>
      </div>
      <button class="rm-btn" onclick="toggleCart('${g.id}');renderCartPage()">✕</button>
    </div>`).join('');
}

function getSimpleName(g){
  // extract series number or year for short format
  const numMatch=g.name.match(/(d+)/);
  const num=numMatch?numMatch[1]:'';
  // if name has number use it, else use year
  const suffix=num&&num!==g.year?`(${num})`:g.year?`(${g.year})`:'';
  // strip repack from name for sms
  const cleanName=g.name.replace(/-[A-Z][a-zA-Z]+.*/,'').trim();
  return cleanName+(suffix?' '+suffix:'');
}

function copySimple(){
  const items=GAMES.filter(g=>cart.includes(g.id));
  const text=items.map((g,i)=>`${i+1}. ${getSimpleName(g)}`).join('\n');
  navigator.clipboard.writeText(text).then(()=>showNotify('✓ متن کپی شد — آماده ارسال'));
}

function copyDetailed(){
  const items=GAMES.filter(g=>cart.includes(g.id));
  const text=items.map((g,i)=>{
    const parts=[g.name];
    if(g.year)parts.push(g.year);
    if(g.size)parts.push(g.size);
    if(g.installTime)parts.push(g.installTime);
    return`${i+1}. ${parts.join(' | ')}`;
  }).join('\n');
  navigator.clipboard.writeText(text).then(()=>showNotify('✓ متن با جزئیات کپی شد'));
}

function showNotify(msg){
  const el=document.getElementById('notify');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>el.style.display='none',2500);
}

function clearCart(){cart=[];saveCart();updateCartUI();renderCartPage();applyFilters();}

function resetAll(){
  cart=[];saveCart();
  document.getElementById('search').value='';
  document.getElementById('filter-type').value='genre';
  expandedId='';
  updateCartUI();updateFilterValues();
}

// init: default filter = genre, all
document.getElementById('filter-type').value='genre';
updateFilterValues();
updateCartUI();
</script>
